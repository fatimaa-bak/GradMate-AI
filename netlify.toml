[build]
  command = "bun run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Secrets (DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL, GEMINI_API_KEY) are set
  # in the Netlify UI under Site configuration → Environment variables, never in
  # this file — putting any value for a known-secret key in a repo file fails
  # Netlify's secrets scanning (exit code 2).

[[plugins]]
  package = "@netlify/plugin-nextjs"
